# STEP 0 — Read shared world state (C-274): GET https://mobius-civic-ai-terminal.vercel.app/api/terminal/snapshot
# ═══════════════════════════════════════════════════════════════════════════════
# GI Gate — Integrity Threshold Enforcement (C-384 PR-3)
# Uses tsx + lib/gi/compute (no bare require, no constant 0.78 fallback).
# Optional production check: set GI_GATE_SNAPSHOT_URL to snapshot-lite in scheduled workflows.
# CC0 Public Domain
# ═══════════════════════════════════════════════════════════════════════════════

name: GI Gate (Integrity Threshold)

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout EPICON Guard (PR template intent parity)
        uses: actions/checkout@v4
        with:
          repository: kaizencycle/epicon
          ref: 8af925208733aaf9668aaedc15bf2a65aab47f21
          path: .epicon-guard

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm test --if-present
        env:
          EPICON_GUARD_PATH: ${{ github.workspace }}/.epicon-guard

  gi-gate:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Install deps
        run: pnpm install --no-frozen-lockfile

      - name: GI gate self-test (sub-minimum fixture must fail threshold)
        run: pnpm exec tsx scripts/ci/evaluate-gi-gate.mts --self-test

      - name: Evaluate GI for merge gate
        id: gi
        run: pnpm exec tsx scripts/ci/evaluate-gi-gate.mts

      - name: Enforce GI threshold (summary)
        env:
          GI_SCORE: ${{ steps.gi.outputs.gi }}
          GI_SOURCE: ${{ steps.gi.outputs.source }}
        run: |
          echo "GI gate source: ${GI_SOURCE:-unknown}"
          echo "GI score: ${GI_SCORE:-missing}"
          if [ -z "${GI_SCORE}" ]; then
            echo "::error::GI gate did not emit gi output"
            exit 1
          fi
