# STEP 0 — Read shared world state (C-274): GET https://mobius-civic-ai-terminal.vercel.app/api/terminal/snapshot
# C-411 JOB-4 — fail-closed Sentinel Review with explicit EVE degraded routing.
# ═══════════════════════════════════════════════════════════════════════════════
# Sentinel Review (AUREA + ATLAS + EVE) — Civic AI Terminal
# ═══════════════════════════════════════════════════════════════════════════════
# CC0 Public Domain
# ═══════════════════════════════════════════════════════════════════════════════

name: Sentinel Review (AUREA + ATLAS + EVE)

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: sentinel-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sentinel:
    runs-on: ubuntu-latest
    env:
      OPENROUTER_BASE_URL: ${{ vars.OPENROUTER_BASE_URL || 'https://openrouter.ai/api/v1' }}
      LLM_BASE_URL: ${{ vars.LLM_BASE_URL || '' }}
      # C-416 Job #4 follow-up: EVE no longer defaults to the same model as ATLAS
      # (both were anthropic/claude-sonnet-4) — a single vendor incident could take
      # out both lanes whose disagreement matters most for civic-risk review.
      SENTINEL_AUREA_MODEL: ${{ vars.SENTINEL_AUREA_MODEL || 'openai/gpt-4o-mini' }}
      SENTINEL_ATLAS_MODEL: ${{ vars.SENTINEL_ATLAS_MODEL || 'anthropic/claude-sonnet-4' }}
      SENTINEL_EVE_MODEL: ${{ vars.SENTINEL_EVE_MODEL || 'google/gemini-2.5-flash' }}
      SENTINEL_EVE_FALLBACK_MODEL: ${{ vars.SENTINEL_EVE_FALLBACK_MODEL || 'openai/gpt-4o-mini' }}
      MAX_DIFF_CHARS: "120000"
      MAX_PROMPT_CHARS: "200000"
      AUTO_LABEL_ON_PASS: "true"
      PASS_LABEL: "consensus:approved"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gate — run when sentinel or custodian labels present
        id: gate
        uses: actions/github-script@v7
        with:
          script: |
            const labels = (context.payload.pull_request.labels || []).map(l => l.name);
            const triggers = [
              'review:aurea',
              'review:atlas',
              'review:eve',
              'consensus:requested',
              'consensus:approved',
              'needs-custodian-review',
            ];
            const matched = labels.filter(l => triggers.includes(l));
            const run = matched.length > 0;
            core.setOutput('run', run ? 'true' : 'false');
            core.setOutput('labels', labels.join(', '));
            core.setOutput('matched', matched.join(', '));

      - name: Skip — no sentinel labels
        if: steps.gate.outputs.run != 'true'
        run: |
          echo "✅ Skipping: add review:aurea, review:atlas, review:eve, consensus:requested, or needs-custodian-review."

      - name: Setup pnpm
        if: steps.gate.outputs.run == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Setup Node
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies (ignore lifecycle scripts)
        if: steps.gate.outputs.run == 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build PR context + diff
        if: steps.gate.outputs.run == 'true'
        id: ctx
        shell: bash
        run: |
          set -euo pipefail
          BASE=${{ github.event.pull_request.base.sha }}
          HEAD=${{ github.event.pull_request.head.sha }}
          git fetch --no-tags --prune --depth=200 origin "${BASE}" "${HEAD}" || true

          git diff --name-only "${BASE}" "${HEAD}" > /tmp/changed_files.txt || true
          git diff --unified=3 "${BASE}" "${HEAD}" > /tmp/pr.diff || true

          python3 - <<'PY'
          import os
          max_chars = int(os.environ.get("MAX_DIFF_CHARS","120000"))
          with open("/tmp/pr.diff","r",encoding="utf-8",errors="ignore") as f:
            s = f.read()
          if len(s) > max_chars:
            s = s[:max_chars] + "\n\n[DIFF TRUNCATED]\n"
          with open("/tmp/pr.diff","w",encoding="utf-8") as f:
            f.write(s)
          PY

          python3 - <<'PY'
          import json, os
          pr = {
            "number": int(os.environ["PR_NUMBER"]),
            "title": os.environ.get("PR_TITLE",""),
            "body": os.environ.get("PR_BODY",""),
            "url": os.environ.get("PR_URL",""),
            "head": os.environ.get("PR_HEAD",""),
            "base": os.environ.get("PR_BASE",""),
            "author": os.environ.get("PR_AUTHOR",""),
          }
          with open("/tmp/pr.meta.json","w",encoding="utf-8") as f:
            json.dump(pr,f,ensure_ascii=False,indent=2)
          PY
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}

      - name: Run AUREA review (model-agnostic LLM)
        if: steps.gate.outputs.run == 'true'
        env:
          SENTINEL_AUREA_API_KEY: ${{ secrets.SENTINEL_AUREA_API_KEY }}
          AGENT_SERVICE_TOKEN: ${{ secrets.AGENT_SERVICE_TOKEN }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SENTINEL_AUREA_BASE_URL: ${{ vars.SENTINEL_AUREA_BASE_URL || '' }}
          SENTINEL_AUREA_PROVIDER: ${{ vars.SENTINEL_AUREA_PROVIDER || '' }}
          REVIEWER: AUREA
          SENTINEL_MODEL: ${{ env.SENTINEL_AUREA_MODEL }}
          SENTINEL_INDEPENDENCE: independent
          OUTCOME_FILE: /tmp/sentinel-aurea.outcome.json
        run: node scripts/sentinel-llm-lane.mjs

      - name: Run ATLAS review (model-agnostic LLM)
        if: steps.gate.outputs.run == 'true'
        env:
          SENTINEL_ATLAS_API_KEY: ${{ secrets.SENTINEL_ATLAS_API_KEY }}
          AGENT_SERVICE_TOKEN: ${{ secrets.AGENT_SERVICE_TOKEN }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SENTINEL_ATLAS_BASE_URL: ${{ vars.SENTINEL_ATLAS_BASE_URL || '' }}
          SENTINEL_ATLAS_PROVIDER: ${{ vars.SENTINEL_ATLAS_PROVIDER || '' }}
          REVIEWER: ATLAS
          SENTINEL_MODEL: ${{ env.SENTINEL_ATLAS_MODEL }}
          SENTINEL_INDEPENDENCE: shared_provider
          OUTCOME_FILE: /tmp/sentinel-atlas.outcome.json
        run: node scripts/sentinel-llm-lane.mjs

      - name: Run EVE review (model-agnostic LLM — primary + advisory fallback)
        if: steps.gate.outputs.run == 'true'
        env:
          SENTINEL_EVE_API_KEY: ${{ secrets.SENTINEL_EVE_API_KEY }}
          SENTINEL_EVE_FALLBACK_API_KEY: ${{ secrets.SENTINEL_EVE_FALLBACK_API_KEY }}
          AGENT_SERVICE_TOKEN: ${{ secrets.AGENT_SERVICE_TOKEN }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SENTINEL_EVE_BASE_URL: ${{ vars.SENTINEL_EVE_BASE_URL || '' }}
          SENTINEL_EVE_FALLBACK_BASE_URL: ${{ vars.SENTINEL_EVE_FALLBACK_BASE_URL || '' }}
          SENTINEL_EVE_PROVIDER: ${{ vars.SENTINEL_EVE_PROVIDER || '' }}
          SENTINEL_EVE_FALLBACK_PROVIDER: ${{ vars.SENTINEL_EVE_FALLBACK_PROVIDER || '' }}
          SENTINEL_EVE_MODEL: ${{ env.SENTINEL_EVE_MODEL }}
          SENTINEL_EVE_FALLBACK_MODEL: ${{ env.SENTINEL_EVE_FALLBACK_MODEL }}
          OUTCOME_FILE: /tmp/sentinel-eve.outcome.json
        run: node scripts/sentinel-llm-eve.mjs

      - name: Ensure review outcome files (fail-closed defaults)
        if: always() && steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ensure_outcome() {
            local file="$1"
            local reviewer="$2"
            if [ ! -f "$file" ]; then
              printf '{"kind":"http_error","reviewer":"%s","provider":"llm","model":"unknown","independence":"unknown","httpStatus":503}\n' "$reviewer" > "$file"
              echo "Wrote default degraded outcome for ${reviewer} → ${file}"
            fi
          }
          ensure_outcome /tmp/sentinel-aurea.outcome.json AUREA
          ensure_outcome /tmp/sentinel-atlas.outcome.json ATLAS
          ensure_outcome /tmp/sentinel-eve.outcome.json EVE

      - name: List repository labels
        if: always() && steps.gate.outputs.run == 'true'
        id: repo-labels
        uses: actions/github-script@v7
        with:
          script: |
            const names = [];
            let page = 1;
            while (page <= 10) {
              const { data } = await github.rest.issues.listLabelsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
                page,
              });
              if (!data.length) break;
              names.push(...data.map((label) => label.name));
              if (data.length < 100) break;
              page += 1;
            }
            core.setOutput('names', names.join(','));

      - name: Pin aggregation policy to base revision
        if: always() && steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          git fetch --no-tags --prune --depth=1 origin "${BASE}" || true
          TRUSTED="/tmp/trusted-sentinelReviewPolicy.ts"
          if git show "${BASE}:lib/governance/sentinelReviewPolicy.ts" > "${TRUSTED}" 2>/dev/null; then
            echo "Using trusted aggregation policy from base ${BASE}"
            echo "${TRUSTED}" > /tmp/sentinel-policy-path.txt
          else
            echo "Base lacks policy module; using PR checkout (bootstrap introduction)"
            echo "./lib/governance/sentinelReviewPolicy.ts" > /tmp/sentinel-policy-path.txt
          fi

      - name: Aggregate sentinel disposition (fail-closed policy)
        if: always() && steps.gate.outputs.run == 'true'
        id: decide
        shell: bash
        run: |
          set -euo pipefail
          export SENTINEL_POLICY_PATH="$(cat /tmp/sentinel-policy-path.txt)"
          export PR_LABELS="${{ steps.gate.outputs.labels }}"
          export REPO_LABELS="${{ steps.repo-labels.outputs.names }}"
          pnpm exec tsx scripts/sentinel-aggregate-disposition.mts

      - name: Export disposition outputs
        if: always() && steps.gate.outputs.run == 'true'
        id: disposition
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('/tmp/sentinel-disposition.json')) {
              core.setOutput('pass', 'false');
              core.setOutput(
                'comment',
                '## 🤖 Sentinel Review\n\n⚠️ Aggregation failed — disposition unavailable. Check workflow logs.',
              );
              return;
            }
            const disposition = JSON.parse(fs.readFileSync('/tmp/sentinel-disposition.json', 'utf8'));
            core.setOutput('pass', String(disposition.approval_eligible));
            core.setOutput('comment', fs.readFileSync('/tmp/sentinel-comment.md', 'utf8'));

      - name: Post or update sentinel comment
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('/tmp/sentinel-comment.md')) {
              core.warning('No sentinel comment file — aggregation may have failed');
              return;
            }
            const body = fs.readFileSync('/tmp/sentinel-comment.md', 'utf8');
            const prNumber = context.payload.pull_request.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: prNumber, per_page: 100
            });
            const marker = '## 🤖 Sentinel Review';
            const existing = comments.find(c => c.user?.type === 'Bot' && (c.body||'').includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: prNumber, body
              });
            }

      - name: Apply idempotent label updates
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('/tmp/sentinel-label-updates.json')) {
              core.warning('No label updates file — skipping label mutation');
              return;
            }
            const updates = JSON.parse(fs.readFileSync('/tmp/sentinel-label-updates.json','utf8'));
            const prNumber = context.payload.pull_request.number;
            const repoLabels = [];
            let page = 1;
            while (page <= 10) {
              const { data } = await github.rest.issues.listLabelsForRepo({
                owner: context.repo.owner, repo: context.repo.repo, per_page: 100, page
              });
              if (!data.length) break;
              repoLabels.push(...data);
              if (data.length < 100) break;
              page += 1;
            }
            const available = new Set(repoLabels.map(l => l.name));
            const { data: labels } = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: prNumber
            });
            const current = new Set(labels.map(l => l.name));
            for (const name of (updates.remove || []).filter(n => available.has(n))) {
              if (current.has(name)) {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: prNumber, name
                });
              }
            }
            const toAdd = (updates.add || []).filter(name => available.has(name) && !current.has(name));
            if (toAdd.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: prNumber, labels: toAdd
              });
            }

      - name: Fail check when approval ineligible
        if: always() && steps.gate.outputs.run == 'true' && steps.disposition.outputs.pass != 'true'
        run: |
          echo "❌ Sentinel review blocked — approval ineligible (degraded, failed, or incomplete lanes)."
          exit 1
