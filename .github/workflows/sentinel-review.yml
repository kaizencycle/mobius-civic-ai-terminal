# STEP 0 — Read shared world state (C-274): GET https://mobius-civic-ai-terminal.vercel.app/api/terminal/snapshot
# C-411 JOB-4 — fail-closed Sentinel Review with explicit EVE degraded routing.
# ═══════════════════════════════════════════════════════════════════════════════
# Sentinel Review (AUREA + ATLAS + EVE) — Civic AI Terminal
# ═══════════════════════════════════════════════════════════════════════════════
# CC0 Public Domain
# ═══════════════════════════════════════════════════════════════════════════════

name: Sentinel Review (AUREA + ATLAS + EVE)

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: sentinel-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sentinel:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_MODEL: gpt-4o-mini
      ANTHROPIC_MODEL: claude-sonnet-4-20250514
      MAX_DIFF_CHARS: "120000"
      MAX_PROMPT_CHARS: "200000"
      AUTO_LABEL_ON_PASS: "true"
      PASS_LABEL: "consensus:approved"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gate — run when sentinel or custodian labels present
        id: gate
        uses: actions/github-script@v7
        with:
          script: |
            const labels = (context.payload.pull_request.labels || []).map(l => l.name);
            const triggers = [
              'review:aurea',
              'review:atlas',
              'review:eve',
              'consensus:requested',
              'consensus:approved',
              'needs-custodian-review',
            ];
            const matched = labels.filter(l => triggers.includes(l));
            const run = matched.length > 0;
            core.setOutput('run', run ? 'true' : 'false');
            core.setOutput('labels', labels.join(', '));
            core.setOutput('matched', matched.join(', '));

      - name: Skip — no sentinel labels
        if: steps.gate.outputs.run != 'true'
        run: |
          echo "✅ Skipping: add review:aurea, review:atlas, review:eve, consensus:requested, or needs-custodian-review."

      - name: Setup pnpm
        if: steps.gate.outputs.run == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Setup Node
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build PR context + diff
        if: steps.gate.outputs.run == 'true'
        id: ctx
        shell: bash
        run: |
          set -euo pipefail
          BASE=${{ github.event.pull_request.base.sha }}
          HEAD=${{ github.event.pull_request.head.sha }}
          git fetch --no-tags --prune --depth=200 origin "${BASE}" "${HEAD}" || true

          git diff --name-only "${BASE}" "${HEAD}" > /tmp/changed_files.txt || true
          git diff --unified=3 "${BASE}" "${HEAD}" > /tmp/pr.diff || true

          python3 - <<'PY'
          import os
          max_chars = int(os.environ.get("MAX_DIFF_CHARS","120000"))
          with open("/tmp/pr.diff","r",encoding="utf-8",errors="ignore") as f:
            s = f.read()
          if len(s) > max_chars:
            s = s[:max_chars] + "\n\n[DIFF TRUNCATED]\n"
          with open("/tmp/pr.diff","w",encoding="utf-8") as f:
            f.write(s)
          PY

          python3 - <<'PY'
          import json, os
          pr = {
            "number": int(os.environ["PR_NUMBER"]),
            "title": os.environ.get("PR_TITLE",""),
            "body": os.environ.get("PR_BODY",""),
            "url": os.environ.get("PR_URL",""),
            "head": os.environ.get("PR_HEAD",""),
            "base": os.environ.get("PR_BASE",""),
            "author": os.environ.get("PR_AUTHOR",""),
          }
          with open("/tmp/pr.meta.json","w",encoding="utf-8") as f:
            json.dump(pr,f,ensure_ascii=False,indent=2)
          PY
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}

      - name: Run AUREA review (OpenAI)
        if: steps.gate.outputs.run == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const writeOutcome = (outcome) => {
              fs.writeFileSync('/tmp/sentinel-aurea.outcome.json', JSON.stringify(outcome));
            };

            const apiKey = process.env.OPENAI_API_KEY;
            if (!apiKey) {
              writeOutcome({ kind: 'missing_credential', reviewer: 'AUREA', credential: 'OPENAI_API_KEY' });
              return;
            }

            const meta = fs.readFileSync('/tmp/pr.meta.json','utf8');
            const diff = fs.readFileSync('/tmp/pr.diff','utf8');
            const files = fs.readFileSync('/tmp/changed_files.txt','utf8');

            const instruction = `
            You are AUREA, a civic integrity reviewer for the Mobius Civic AI Terminal.
            Return ONLY valid JSON (no markdown):
            {"verdict":"pass"|"fail","summary":"string","blocking":["..."],"non_blocking":["..."]}
            Only "fail" when at least one blocking item exists. Cite file paths.
            `;

            const content = `# AUREA Review\n## PR Meta\n${meta}\n## Changed files\n${files}\n## Diff\n${diff}\n${instruction}`;
            const maxP = parseInt(process.env.MAX_PROMPT_CHARS || '200000', 10);
            const finalContent = content.length > maxP ? content.slice(0, maxP) + '\n[TRUNCATED]' : content;

            const res = await fetch('https://api.openai.com/v1/chat/completions', {
              method: 'POST',
              headers: { 'Authorization': `Bearer ${apiKey}`, 'Content-Type': 'application/json' },
              body: JSON.stringify({
                model: process.env.OPENAI_MODEL || 'gpt-4o-mini',
                temperature: 0.1,
                messages: [
                  { role: 'system', content: 'You are AUREA. Return STRICT JSON only.' },
                  { role: 'user', content: finalContent }
                ]
              })
            });

            if (!res.ok) {
              writeOutcome({
                kind: 'http_error',
                reviewer: 'AUREA',
                provider: 'openai',
                model: process.env.OPENAI_MODEL || 'gpt-4o-mini',
                independence: 'independent',
                httpStatus: res.status,
              });
              return;
            }

            const data = await res.json();
            let text = (data?.choices?.[0]?.message?.content ?? '').trim();
            if (text.startsWith('```json')) text = text.slice(7);
            if (text.startsWith('```')) text = text.slice(3);
            if (text.endsWith('```')) text = text.slice(0, -3);

            writeOutcome({
              kind: 'legacy_json',
              reviewer: 'AUREA',
              provider: 'openai',
              model: process.env.OPENAI_MODEL || 'gpt-4o-mini',
              independence: 'independent',
              raw: text.trim(),
            });

      - name: Run ATLAS review (Anthropic)
        if: steps.gate.outputs.run == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const writeOutcome = (outcome) => {
              fs.writeFileSync('/tmp/sentinel-atlas.outcome.json', JSON.stringify(outcome));
            };

            const apiKey = process.env.ANTHROPIC_API_KEY;
            if (!apiKey) {
              writeOutcome({ kind: 'missing_credential', reviewer: 'ATLAS', credential: 'ANTHROPIC_API_KEY' });
              return;
            }

            const meta = fs.readFileSync('/tmp/pr.meta.json','utf8');
            const diff = fs.readFileSync('/tmp/pr.diff','utf8');
            const files = fs.readFileSync('/tmp/changed_files.txt','utf8');

            const instruction = `
            You are ATLAS, the primary sentinel of the Mobius Civic AI Terminal.
            Return ONLY valid JSON (no markdown):
            {"verdict":"pass"|"fail","summary":"string","blocking":["..."],"non_blocking":["..."]}
            Only "fail" when at least one blocking item exists. Cite file paths.
            `;

            const content = `# ATLAS Review\n## PR Meta\n${meta}\n## Changed files\n${files}\n## Diff\n${diff}\n${instruction}`;
            const maxP = parseInt(process.env.MAX_PROMPT_CHARS || '200000', 10);
            const finalContent = content.length > maxP ? content.slice(0, maxP) + '\n[TRUNCATED]' : content;

            const res = await fetch('https://api.anthropic.com/v1/messages', {
              method: 'POST',
              headers: {
                'x-api-key': apiKey,
                'anthropic-version': '2023-06-01',
                'content-type': 'application/json'
              },
              body: JSON.stringify({
                model: process.env.ANTHROPIC_MODEL || 'claude-sonnet-4-20250514',
                max_tokens: 1200,
                temperature: 0.1,
                system: 'You are ATLAS. Return STRICT JSON only.',
                messages: [{ role: 'user', content: finalContent }]
              })
            });

            if (!res.ok) {
              writeOutcome({
                kind: 'http_error',
                reviewer: 'ATLAS',
                provider: 'anthropic',
                model: process.env.ANTHROPIC_MODEL || 'claude-sonnet-4-20250514',
                independence: 'shared_provider',
                httpStatus: res.status,
              });
              return;
            }

            const data = await res.json();
            let text = (data?.content || []).map(p => p.text || '').join('\n').trim();
            if (text.startsWith('```json')) text = text.slice(7);
            if (text.startsWith('```')) text = text.slice(3);
            if (text.endsWith('```')) text = text.slice(0, -3);

            writeOutcome({
              kind: 'legacy_json',
              reviewer: 'ATLAS',
              provider: 'anthropic',
              model: process.env.ANTHROPIC_MODEL || 'claude-sonnet-4-20250514',
              independence: 'shared_provider',
              raw: text.trim(),
            });

      - name: Run EVE review (civic risk — Anthropic primary, OpenAI fallback advisory)
        if: steps.gate.outputs.run == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const writeOutcome = (outcome) => {
              fs.writeFileSync('/tmp/sentinel-eve.outcome.json', JSON.stringify(outcome));
            };

            try {
              const anthropicKey = process.env.ANTHROPIC_API_KEY;
              const openaiKey = process.env.OPENAI_API_KEY;
              if (!anthropicKey && !openaiKey) {
                writeOutcome({ kind: 'missing_credential', reviewer: 'EVE', credential: 'ANTHROPIC_API_KEY|OPENAI_API_KEY' });
                return;
              }

              const meta = fs.readFileSync('/tmp/pr.meta.json','utf8');
              const diff = fs.readFileSync('/tmp/pr.diff','utf8');
              const files = fs.readFileSync('/tmp/changed_files.txt','utf8');

              const instruction = `
              You are EVE, the civic-risk and ethics reviewer for the Mobius Civic AI Terminal.
              Return ONLY valid JSON (no markdown):
              {"verdict":"pass"|"fail","summary":"string","blocking":["..."],"non_blocking":["..."]}
              Never silently approve high-risk civic harm. Only "fail" when at least one blocking item exists.
              `;

              const content = `# EVE Review\n## PR Meta\n${meta}\n## Changed files\n${files}\n## Diff\n${diff}\n${instruction}`;
              const maxP = parseInt(process.env.MAX_PROMPT_CHARS || '200000', 10);
              const finalContent = content.length > maxP ? content.slice(0, maxP) + '\n[TRUNCATED]' : content;
              const degraded = [401, 402, 403, 429, 500, 502, 503, 504];

              async function callAnthropic() {
                const res = await fetch('https://api.anthropic.com/v1/messages', {
                  method: 'POST',
                  headers: {
                    'x-api-key': anthropicKey,
                    'anthropic-version': '2023-06-01',
                    'content-type': 'application/json'
                  },
                  body: JSON.stringify({
                    model: process.env.ANTHROPIC_MODEL || 'claude-sonnet-4-20250514',
                    max_tokens: 1200,
                    temperature: 0.1,
                    system: 'You are EVE. Return STRICT JSON only.',
                    messages: [{ role: 'user', content: finalContent }]
                  })
                });
                return { res, provider: 'anthropic', model: process.env.ANTHROPIC_MODEL || 'claude-sonnet-4-20250514', independence: 'shared_provider' };
              }

              async function callOpenAiFallback(reason) {
                const res = await fetch('https://api.openai.com/v1/chat/completions', {
                  method: 'POST',
                  headers: { 'Authorization': `Bearer ${openaiKey}`, 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                    model: process.env.OPENAI_MODEL || 'gpt-4o-mini',
                    temperature: 0.1,
                    messages: [
                      { role: 'system', content: 'You are an advisory fallback for EVE civic-risk review. Return STRICT JSON only. This is NOT independent EVE attestation.' },
                      { role: 'user', content: finalContent }
                    ]
                  })
                });
                return { res, provider: 'openai', model: process.env.OPENAI_MODEL || 'gpt-4o-mini', independence: 'shared_provider', reason };
              }

              function writeFallbackOutcome(attempt, reason) {
                return attempt.res.json().then((data) => {
                  let text = (data?.choices?.[0]?.message?.content ?? '').trim();
                  if (text.startsWith('```json')) text = text.slice(7);
                  if (text.startsWith('```')) text = text.slice(3);
                  if (text.endsWith('```')) text = text.slice(0, -3);
                  writeOutcome({
                    kind: 'fallback_json',
                    reviewer: 'EVE',
                    provider: attempt.provider,
                    model: attempt.model,
                    raw: text.trim(),
                    reason,
                  });
                });
              }

              let attempt = null;
              let anthropicTransportError = null;

              if (anthropicKey) {
                try {
                  attempt = await callAnthropic();
                } catch (err) {
                  anthropicTransportError = err;
                }

                const shouldTryFallback =
                  anthropicTransportError ||
                  (attempt && !attempt.res.ok && degraded.includes(attempt.res.status));

                if (shouldTryFallback && openaiKey) {
                  try {
                    const fallback = await callOpenAiFallback(
                      anthropicTransportError
                        ? `Anthropic transport failure — OpenAI advisory fallback (not independent EVE quorum)`
                        : 'Anthropic unavailable — OpenAI advisory fallback (not independent EVE quorum)',
                    );
                    if (fallback.res.ok) {
                      await writeFallbackOutcome(
                        fallback,
                        anthropicTransportError
                          ? `Anthropic transport failure — OpenAI advisory fallback (not independent EVE quorum)`
                          : 'Anthropic unavailable — OpenAI advisory fallback (not independent EVE quorum)',
                      );
                      return;
                    }
                    attempt = fallback;
                  } catch (fallbackErr) {
                    writeOutcome({
                      kind: 'http_error',
                      reviewer: 'EVE',
                      provider: 'openai',
                      model: process.env.OPENAI_MODEL || 'gpt-4o-mini',
                      independence: 'shared_provider',
                      httpStatus: 503,
                    });
                    return;
                  }
                } else if (anthropicTransportError) {
                  writeOutcome({
                    kind: 'http_error',
                    reviewer: 'EVE',
                    provider: 'anthropic',
                    model: process.env.ANTHROPIC_MODEL || 'claude-sonnet-4-20250514',
                    independence: 'shared_provider',
                    httpStatus: 503,
                  });
                  return;
                }
              } else if (openaiKey) {
                try {
                  attempt = await callOpenAiFallback('Anthropic credential missing — OpenAI advisory fallback only');
                  if (attempt.res.ok) {
                    await writeFallbackOutcome(attempt, 'Anthropic credential missing — OpenAI advisory fallback only');
                    return;
                  }
                } catch (fallbackErr) {
                  writeOutcome({
                    kind: 'http_error',
                    reviewer: 'EVE',
                    provider: 'openai',
                    model: process.env.OPENAI_MODEL || 'gpt-4o-mini',
                    independence: 'shared_provider',
                    httpStatus: 503,
                  });
                  return;
                }
              }

              if (!attempt || !attempt.res.ok) {
                writeOutcome({
                  kind: 'http_error',
                  reviewer: 'EVE',
                  provider: attempt?.provider || 'anthropic',
                  model: attempt?.model || process.env.ANTHROPIC_MODEL || 'claude-sonnet-4-20250514',
                  independence: 'shared_provider',
                  httpStatus: attempt?.res?.status || 503,
                });
                return;
              }

              const data = await attempt.res.json();
              let text = (data?.content || []).map(p => p.text || '').join('\n').trim();
              if (!text && data?.choices?.[0]?.message?.content) {
                text = data.choices[0].message.content.trim();
              }
              if (text.startsWith('```json')) text = text.slice(7);
              if (text.startsWith('```')) text = text.slice(3);
              if (text.endsWith('```')) text = text.slice(0, -3);

              if (attempt.provider === 'openai') {
                writeOutcome({
                  kind: 'fallback_json',
                  reviewer: 'EVE',
                  provider: attempt.provider,
                  model: attempt.model,
                  raw: text.trim(),
                  reason: attempt.reason || 'OpenAI advisory fallback — not independent EVE quorum',
                });
                return;
              }

              writeOutcome({
                kind: 'legacy_json',
                reviewer: 'EVE',
                provider: attempt.provider,
                model: attempt.model,
                independence: attempt.independence,
                raw: text.trim(),
              });
            } catch (err) {
              writeOutcome({
                kind: 'http_error',
                reviewer: 'EVE',
                provider: 'anthropic',
                model: process.env.ANTHROPIC_MODEL || 'claude-sonnet-4-20250514',
                independence: 'shared_provider',
                httpStatus: 503,
              });
            }

      - name: Aggregate sentinel disposition (fail-closed policy)
        if: steps.gate.outputs.run == 'true'
        id: decide
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec tsx <<'TS'
          import { readFileSync, writeFileSync } from 'node:fs';
          import {
            buildDispositionFromStepOutcomes,
            computeLabelUpdates,
            renderSentinelReviewComment,
            type ReviewStepOutcome,
          } from './lib/governance/sentinelReviewPolicy.ts';

          const labels = (process.env.PR_LABELS || '').split(',').map((s) => s.trim()).filter(Boolean);
          const observedAt = new Date().toISOString();
          const paths = [
            '/tmp/sentinel-aurea.outcome.json',
            '/tmp/sentinel-atlas.outcome.json',
            '/tmp/sentinel-eve.outcome.json',
          ];
          const outcomes = paths.map((path) => JSON.parse(readFileSync(path, 'utf8')) as ReviewStepOutcome);
          const disposition = buildDispositionFromStepOutcomes({ labels, outcomes, observedAt });
          const labelUpdates = computeLabelUpdates({
            disposition,
            currentLabels: labels,
          });
          writeFileSync('/tmp/sentinel-disposition.json', JSON.stringify(disposition, null, 2));
          writeFileSync('/tmp/sentinel-comment.md', renderSentinelReviewComment(disposition));
          writeFileSync('/tmp/sentinel-label-updates.json', JSON.stringify(labelUpdates, null, 2));
          console.log(`approval_eligible=${disposition.approval_eligible}`);
          TS
        env:
          PR_LABELS: ${{ steps.gate.outputs.labels }}

      - name: Export disposition outputs
        if: steps.gate.outputs.run == 'true'
        id: disposition
        shell: bash
        run: |
          echo "pass=$(node -p "JSON.parse(require('fs').readFileSync('/tmp/sentinel-disposition.json','utf8')).approval_eligible")" >> "$GITHUB_OUTPUT"
          echo "comment<<EOF" >> "$GITHUB_OUTPUT"
          cat /tmp/sentinel-comment.md >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Post or update sentinel comment
        if: steps.gate.outputs.run == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/sentinel-comment.md', 'utf8');
            const prNumber = context.payload.pull_request.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: prNumber, per_page: 100
            });
            const marker = '## 🤖 Sentinel Review';
            const existing = comments.find(c => c.user?.type === 'Bot' && (c.body||'').includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: prNumber, body
              });
            }

      - name: Apply idempotent label updates
        if: steps.gate.outputs.run == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const updates = JSON.parse(fs.readFileSync('/tmp/sentinel-label-updates.json','utf8'));
            const prNumber = context.payload.pull_request.number;
            const { data: labels } = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: prNumber
            });
            const current = new Set(labels.map(l => l.name));
            for (const name of updates.remove || []) {
              if (current.has(name)) {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: prNumber, name
                });
              }
            }
            const toAdd = (updates.add || []).filter(name => !current.has(name));
            if (toAdd.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: prNumber, labels: toAdd
              });
            }

      - name: Fail check when approval ineligible
        if: steps.gate.outputs.run == 'true' && steps.disposition.outputs.pass != 'true'
        run: |
          echo "❌ Sentinel review blocked — approval ineligible (degraded, failed, or incomplete lanes)."
          exit 1
